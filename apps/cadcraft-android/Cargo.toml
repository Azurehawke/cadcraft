[package]
name = "cadcraft-android"
description = "CADCraft on Android tablets (NativeActivity; build with packaging/android/build-apk.sh)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lib]
# Loaded by Android's NativeActivity as libcadcraft_android.so.
crate-type = ["cdylib"]

# Not the workspace lints: `unsafe_code = "forbid"` can't be relaxed per item, and Android needs a
# few unsafe-attributed items here (the exported `android_main`, `set_var` before any thread
# starts, and wrapping the JavaVM and activity pointers Android hands over). Everything else in
# the crate stays safe.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"

[target.'cfg(target_os = "android")'.dependencies]
cadcraft-engine = { workspace = true }
cadcraft-io = { workspace = true }
cadcraft-ui-egui = { workspace = true }
# No accesskit: eframe only offers it on Android with GameActivity, which needs Java and Gradle;
# CADCraft uses NativeActivity there (as PdfCraft and WordCraft do).
eframe = { workspace = true, features = ["default_fonts", "wgpu", "persistence", "android-native-activity"] }
egui = { workspace = true }
# The AndroidApp handle (resolves to vendor/winit, like eframe's own).
winit = { version = "0.30", default-features = false, features = ["android-native-activity"] }
serde_json = { workspace = true }
log = { workspace = true }
android_logger = "0.15"
# All files access, drawings sent by other apps, the clipboard, updates, through JNI.
jni = "0.21"
ndk-context = "0.1"
# Whether a hardware keyboard is attached (tablet.rs; already in the build through android-activity).
ndk = { version = "0.9", default-features = false }
